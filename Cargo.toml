[package]
repository = "https://github.com/SuperInstance/license-compliance"
name = "license-compliance"
version = "0.1.0"
edition = "2021"
description = "CLI tool to check open-source license compatibility across dependency trees"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
